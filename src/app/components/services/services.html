<div class="services-page">

  <h2 class="services-heading anim-fade-down" [animateOnScroll]="'anim-fade-down-show'">
    <span class="orange">{{ i18n.t('servicesPrefix') }}</span>
    <span class="services-main">{{ i18n.t('servicesMain') }}</span>
  </h2>

  <div class="services-grid stagger anim-scale-up" [animateOnScroll]="'anim-scale-up-show'">
    @for (service of displayServices; track service.title; let i = $index) {
      <article class="service-card stagger-child">
        <div class="card-header" [class.card-header-alt]="service.isAlt">
          <div class="card-icon" aria-hidden="true">
            <div [innerHTML]="service.svg"></div>
          </div>
          <h3 class="card-title">{{ service.title }}</h3>
        </div>
        <div class="card-body">
          <p class="card-desc">{{ service.desc }}</p>
          @if (service.image) {
            <div class="card-image">
              <img [src]="service.image" [alt]="service.title">
            </div>
          }
        </div>
      </article>
    }
  </div>
</div>
