<section class="relative overflow-hidden bg-[#143D59] min-h-[78vh]">

  <!-- Image fond : natural-size centered, don't upscale -->
   <img data-hero-bg 
        src="assets/photo.jpeg" 
        alt="Photo d'Innocent DEMBELE - Développeur Full Stack Angular, Spring Boot, Flutter, Burkina Faso" 
        title="Innocent DEMBELE - Développeur Full Stack Web et Mobile"
        loading="eager"
        fetchpriority="high"
        class="hero-bg-img z-0">

  <!-- Overlay sombre -->
  <div class="absolute inset-0 z-0 hero-overlay" style="background: rgba(10,10,20,0.65);"></div>

  <!-- Contenu pyramide (texte fourni par l'utilisateur) -->
  <div class="relative z-20 h-full flex flex-col items-center justify-start py-12 px-6 text-center">

  <!-- VAGUES PISCINE (sans fond, juste les ondulations) -->
  <canvas id="waveCanvas" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;"></canvas>

  <style>
    /* ---- ANIMATIONS ---- */
    @keyframes revealSmooth {
      0%   { opacity:0; transform:translateY(100px) scale(0.85); filter:blur(15px); }
      60%  { opacity:1; transform:translateY(-10px) scale(1.02); filter:blur(3px); }
      100% { opacity:1; transform:translateY(0) scale(1); filter:blur(0); }
    }
    @keyframes fadeSoft {
      from { opacity:0; transform:translateY(30px); }
      to   { opacity:1; transform:translateY(0); }
    }
    @keyframes glowPulse {
      0%,100% { text-shadow: 0 0 10px rgba(22,163,74,0.3); }
      50%     { text-shadow: 0 0 35px rgba(22,163,74,0.7); }
    }
    @keyframes floatSoft {
      0%,100% { transform: translateY(0); }
      50%     { transform: translateY(-12px); }
    }

    /* ---- HERO LINES ---- */
    .hero-line {
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      opacity: 0;
      transform: translateY(80px) scale(0.9);
      filter: blur(12px);
      animation: revealSmooth 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .hero-line:hover {
      transform: scale(1.06);
      text-shadow: 0 0 40px rgba(20,61,89,0.9);
      transition: all 0.3s ease;
    }
    .line-1 {
      font-size: clamp(1rem, 2vw, 1.5rem);
      color: rgba(255,255,255,0.5);
      letter-spacing: 0.3em;
    }
    .line-2 {
      font-size: clamp(2.5rem, 7vw, 5.5rem);
      background: linear-gradient(90deg, #16a34a, #143D59, #143D59);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .line-3, .line-4 {
      font-size: clamp(1rem, 2vw, 1.4rem);
      color: rgba(255,255,255,0.7);
    }
    .line-5 {
      font-size: clamp(1.5rem, 3vw, 2.2rem);
      color: white;
      animation: revealSmooth 1.2s ease forwards, glowPulse 3s infinite !important;
    }
    .hero-motive {
      font-size: 0.95rem;
      color: rgba(255,255,255,0.5);
      letter-spacing: 0.08em;
      opacity: 0;
      transform: translateY(40px);
      animation: fadeSoft 1s ease forwards;
    }

    /* ---- DELAYS ---- */
    .fly-in-1 .hero-line { animation-delay: 0.3s; }
    .fly-in-2 .hero-line { animation-delay: 0.6s; }
    .fly-in-3 .hero-line { animation-delay: 0.9s; }
    .fly-in-4 .hero-line { animation-delay: 1.2s; }
    .fly-in-5 .hero-line { animation-delay: 1.5s; }
    .hero-motive:nth-child(1) { animation-delay: 1.8s; }
    .hero-motive:nth-child(2) { animation-delay: 2.0s; }

    /* ---- TYPING CURSOR ---- */
    #typingWord {
      color: #143D59;
      border-right: 2px solid #143D59;
      padding-right: 3px;
      -webkit-text-fill-color: #143D59;
    }

    /* ---- FLOAT GLOBAL ---- */
    .hero-content {
      animation: floatSoft 6s ease-in-out infinite;
      position: relative;
      z-index: 10;
    }
  </style>

  <!-- TEXTES -->
   <div class="flex flex-col items-center gap-4 max-w-[1100px] px-4 hero-content">
     <!-- Banner box matching the screenshot: centered white-bordered panel with translucent dark inner bg -->
     <div class="hero-banner">
         <div class="hero-banner-box anim-fade-in" [animateOnScroll]="'anim-fade-in-show'">
          <p class="banner-title anim-fade-down" [animateOnScroll]="'anim-fade-down-show'">{{ i18n.t('hero_greeting') }} <span class="accent anim-bounce-in" [animateOnScroll]="'anim-bounce-in-show'">DEMBELE Innocode</span>, {{ i18n.t('hero_role') }}. Pour tous vos projets, <span class="accent anim-bounce-in" [animateOnScroll]="'anim-bounce-in-show'">{{ i18n.t('hero_contact_cta') }}</span></p>
      </div>
    </div>
   </div>

</div>

  <!-- Badges services à la frontière hero/about (absolus, sans agrandir le hero) -->
  <div class="hero-services-row stagger anim-fade-up" [animateOnScroll]="'anim-fade-up-show'">
    <span class="hero-service-tag stagger-child">Codage</span>
    <span class="hero-service-tag stagger-child">Installation</span>
    <span class="hero-service-tag stagger-child">Activation</span>
    <span class="hero-service-tag stagger-child">Maintenance</span>
  </div>
</section>
