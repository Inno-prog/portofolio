<nav class="navbar">
  <div class="nav-inner">

    <!-- LOGO tout à gauche, seul -->
    <div class="nav-brand" (click)="handleClick({label:'Accueil', sectionId:'home'})">
      <img src="assets/innocode-logo.png" alt="InnoCode" class="brand-logo-img" />
    </div>

    <!-- CENTRE : liens gauche + photo + liens droite -->
    <div class="nav-center">
      <div class="nav-links-left">
        @for (link of leftLinks; track link.labelKey) {
          <button
            (click)="handleClick(link)"
            class="nav-link"
            [class.active-link]="isActiveSection(link.sectionId)"
          >{{ i18n.t(link.labelKey || 'nav_portfolio') }}</button>
        }
      </div>

      <button class="nav-photo" (click)="handleClick({label:'Accueil', sectionId:'home'})">
        <div class="photo-ring">
          <img src="assets/photo.jpeg" alt="Accueil">
        </div>
      </button>

      <div class="nav-links-right">
        @for (link of rightLinks; track link.labelKey) {
          <button (click)="handleClick(link)" class="nav-link" [class.active-link]="isActiveSection(link.sectionId)">{{ i18n.t(link.labelKey || 'nav_services') }}</button>
        }
      </div>
    </div>

    <!-- CONTROLS : Theme + Langue -->
    <div class="nav-controls">
      <div class="lang-switch">
        <button (click)="setLang('fr')" [class.active]="i18n.lang==='fr'">{{ i18n.t('fr') }}</button>
        <button (click)="setLang('en')" [class.active]="i18n.lang==='en'">{{ i18n.t('en') }}</button>
      </div>
      <button (click)="toggleTheme()">{{ i18n.t('theme') }}</button>
    </div>

    <!-- Hamburger mobile -->
    <button class="hamburger" (click)="toggleMobile()" aria-label="Menu">
      @if (!mobileOpen) {
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M3 6h18M3 12h18M3 18h18" stroke="#143D59" stroke-width="2" stroke-linecap="round"/>
        </svg>
      } @else {
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M6 6l12 12M6 18L18 6" stroke="#143D59" stroke-width="2" stroke-linecap="round"/>
        </svg>
      }
    </button>

  </div>

  <!-- Menu mobile déroulant -->
      @if (mobileOpen) {
    <div class="mobile-menu">
      @for (link of allLinks; track link.labelKey) {
  <button (click)="handleClick(link)" class="mobile-link" [class.active-link]="isActiveSection(link.sectionId)">{{ i18n.t(link.labelKey || 'nav_portfolio') }}</button>
      }

    </div>
  }
</nav>
